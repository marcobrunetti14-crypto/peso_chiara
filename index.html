<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Il Peso di Baby</title>
    <!-- Questa riga dice al telefono che è un'app installabile -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Peso Baby">
    
    <style>
        :root {
            --primary-color: #ffb6c1; /* Rosa pastello neonati */
            --background-color: #fff9fa; /* Sfondo morbido */
            --text-color: #5c4d4d;
            --card-bg: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--background-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .app-container {
            background: var(--card-bg);
            border-radius: 30px;
            box-shadow: 0 10px 30px rgba(255, 182, 193, 0.3);
            width: 100%;
            max-width: 450px;
            padding: 30px;
            text-align: center;
            border: 4px solid #ffe4e1;
        }

        h1 {
            font-size: 2rem;
            color: #ff8da1;
            margin-bottom: 5px;
        }

        .subtitle {
            font-size: 0.9rem;
            color: #8c7b7b;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 0.95rem;
            color: #7a6666;
        }

        input, select {
            width: 100%;
            padding: 15px;
            border: 2px solid #ffe4e1;
            border-radius: 20px;
            font-size: 1.1rem;
            color: var(--text-color);
            background-color: #fffcfc;
            outline: none;
        }

        input:focus, select:focus {
            border-color: var(--primary-color);
        }

        .weight-input-container {
            position: relative;
        }

        .weight-unit {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            font-weight: bold;
            color: #bfa3a3;
        }

        button {
            width: 100%;
            background: linear-gradient(135deg, #ffb6c1, #ff94a2);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 20px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 148, 162, 0.4);
            margin-top: 10px;
        }

        .status-message {
            margin-top: 20px;
            padding: 12px;
            border-radius: 15px;
            font-size: 0.95rem;
            display: none;
        }

        .status-success { background-color: #e3fcef; color: #0e6245; display: block; }
        .status-error { background-color: #ffebe6; color: #bf2600; display: block; }
    </style>
</head>
<body>

    <div class="app-container">
        <h1>Il Peso di Baby 🎀</h1>
        <div class="subtitle">Per Francesca • Registra la crescita con un click</div>

        <form id="weightForm">
            <div class="form-group">
                <label for="date">Data e Ora della pesata</label>
                <input type="datetime-local" id="date" required>
            </div>

            <div class="form-group">
                <label for="weight">Peso Esatto</label>
                <div class="weight-input-container">
                    <!-- inputmode="decimal" apre subito i numeri grandi sulla tastiera del telefono -->
                    <input type="number" id="weight" step="0.001" min="0" placeholder="es. 3.450" inputmode="decimal" required>
                    <span class="weight-unit">kg</span>
                </div>
            </div>

            <div class="form-group">
                <label for="notes">Momento della pesata</label>
                <!-- MODIFICATO: Ora è un menù a scelta fissa con le tue due opzioni -->
                <select id="notes" required>
                    <option value="Prima della pesata">🍼 Prima della pesata</option>
                    <option value="Dopo la pesata">✨ Dopo la pesata</option>
                </select>
            </div>

            <button type="submit" id="submitBtn">Salva Pesata ✨</button>
        </form>

        <div id="status" class="status-message"></div>
    </div>

    <script>
        // Mette in automatico l'ora di adesso per non far perdere tempo a Francesca
        window.addEventListener('DOMContentLoaded', () => {
            const now = new Date();
            now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
            document.getElementById('date').value = now.toISOString().slice(0, 16);
        });

        // Metti qui l'URL che ti darà Google quando distribuisci lo script
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw4BuzuFL1EJVprL1269JoCCWMhNgcKa6VmuKyTPb65uwKa08TvwAhDqypzm5vcyLSe/exec";

        document.getElementById('weightForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            const statusDiv = document.getElementById('status');
            
            submitBtn.disabled = true;
            submitBtn.innerText = 'Salvataggio in corso...';
            statusDiv.style.display = 'none';

            const formData = {
                date: document.getElementById('date').value,
                weight: document.getElementById('weight').value,
                notes: document.getElementById('notes').value
            };

            fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                cache: 'no-cache',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(formData)
            })
            .then(() => {
                statusDiv.innerText = "Pesata salvata con successo nel foglio! 💖👶🏼";
                statusDiv.className = 'status-message status-success';
                
                // Svuota il peso per la prossima volta
                document.getElementById('weight').value = '';
                
                // Aggiorna l'ora a quella attuale
                const now = new Date();
                now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
                document.getElementById('date').value = now.toISOString().slice(0, 16);
            })
            .catch(error => {
                console.error(error);
                statusDiv.innerText = "Errore nel salvataggio. Riprova! ❌";
                statusDiv.className = 'status-message status-error';
            })
            .finally(() => {
                submitBtn.disabled = false;
                submitBtn.innerText = 'Salva Pesata ✨';
            });
        });
    </script>
</body>
</html>
