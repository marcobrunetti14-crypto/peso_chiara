<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Il Peso di Baby</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Peso Baby">
    
    <!-- Libreria html2pdf per scaricare il PDF direttamente dal telefono -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        :root {
            --primary-color: #ffb6c1; 
            --background-color: #fff9fa; 
            --text-color: #5c4d4d;
            --card-bg: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--background-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .app-container {
            background: var(--card-bg);
            border-radius: 30px;
            box-shadow: 0 10px 30px rgba(255, 182, 193, 0.3);
            width: 100%;
            max-width: 500px;
            padding: 30px;
            text-align: center;
            border: 4px solid #ffe4e1;
            margin-bottom: 30px;
        }

        .header-decor {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 2rem;
            color: #ff8da1;
            margin-bottom: 5px;
        }

        .subtitle {
            font-size: 0.9rem;
            color: #8c7b7b;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 0.95rem;
            color: #7a6666;
        }

        input, select {
            width: 100%;
            padding: 15px;
            border: 2px solid #ffe4e1;
            border-radius: 20px;
            font-size: 1.1rem;
            color: var(--text-color);
            background-color: #fffcfc;
            outline: none;
        }

        input:focus, select:focus {
            border-color: var(--primary-color);
        }

        .weight-input-container {
            position: relative;
        }

        .weight-unit {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            font-weight: bold;
            color: #bfa3a3;
        }

        button {
            width: 100%;
            background: linear-gradient(135deg, #ffb6c1, #ff94a2);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 20px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 148, 162, 0.4);
            margin-top: 10px;
        }

        .btn-pdf {
            background: linear-gradient(135deg, #a0e7e5, #74d1cf);
            box-shadow: 0 5px 15px rgba(160, 231, 229, 0.6);
            margin-top: 20px;
            color: #3d5a59;
        }

        .status-message {
            margin-top: 20px;
            padding: 12px;
            border-radius: 15px;
            font-size: 0.95rem;
            display: none;
        }

        .status-success { background-color: #e3fcef; color: #0e6245; display: block; }
        .status-error { background-color: #ffebe6; color: #bf2600; display: block; }

        /* Stile Tabella di Riepilogo nell'App */
        .table-container {
            width: 100%;
            max-width: 600px;
            background: white;
            border-radius: 25px;
            padding: 20px;
            border: 4px solid #ffe4e1;
            box-shadow: 0 10px 30px rgba(255, 182, 193, 0.2);
            overflow-x: auto;
        }

        .table-title {
            color: #ff8da1;
            margin-bottom: 15px;
            font-size: 1.4rem;
            text-align: center;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 12px 15px;
            border-bottom: 1px solid #ffe4e1;
            font-size: 0.95rem;
        }

        th {
            background-color: #fff1f3;
            color: #ff8da1;
            font-weight: bold;
        }

        /* TRUCCO PER IL PDF: Spostato fuori dallo schermo visivo per la corretta lettura della libreria */
        #pdf-template {
            position: absolute;
            left: -9999px;
            top: 0;
            width: 700px; 
        }

        .pdf-page {
            background-color: #fff9fa;
            color: #5c4d4d;
            padding: 40px;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }

        .pdf-header {
            text-align: center;
            border-bottom: 3px dashed #ffb6c1;
            padding-bottom: 20px;
            margin-bottom: 30px;
        }

        .pdf-header h1 {
            color: #ff8da1;
            font-size: 2.6rem;
            margin-bottom: 8px;
        }

        .pdf-table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        .pdf-table th {
            background-color: #ffb6c1;
            color: white;
            padding: 14px;
            font-size: 1.1rem;
        }

        .pdf-table td {
            padding: 14px;
            border-bottom: 1px solid #ffe4e1;
            font-size: 1rem;
        }
    </style>
</head>
<body>

    <!-- INTERFACCIA WEB APP -->
    <div class="app-container">
        <div class="header-decor">👶🏼 🎀 🍼 ✨</div>
        <h1>Il Peso di Baby 🎀</h1>
        <div class="subtitle">Per Francesca • Registra la crescita con un click</div>

        <form id="weightForm">
            <div class="form-group">
                <label for="date">📅 Data e Ora della pesata</label>
                <input type="datetime-local" id="date" required>
            </div>

            <div class="form-group">
                <label for="weight">⚖️ Peso Esatto</label>
                <div class="weight-input-container">
                    <input type="number" id="weight" step="0.001" min="0" placeholder="es. 3.450" inputmode="decimal" required>
                    <span class="weight-unit">kg</span>
                </div>
            </div>

            <div class="form-group">
                <label for="moment">🍼 Momento della pesata</label>
                <select id="moment" required>
                    <option value="Prima della pesata">🍼 Prima della pesata</option>
                    <option value="Dopo la pesata">✨ Dopo la pesata</option>
                </select>
            </div>

            <div class="form-group">
                <label for="notes">📝 Appunti e Note Libere</label>
                <input type="text" id="notes" placeholder="Scrivi qui altri dettagli (es. nuda, tranquilla...)">
            </div>

            <button type="submit" id="submitBtn">Salva Pesata ✨</button>
        </form>

        <div id="status" class="status-message"></div>
        
        <!-- TASTO SCARICA PDF -->
        <button type="button" class="btn-pdf" id="downloadPdfBtn">📥 Scarica PDF "Piccola Baby"</button>
    </div>

    <!-- TABELLA RIEPILOGO NELL'APP -->
    <div class="table-container">
        <h2 class="table-title">📊 Riepilogo delle Pesate</h2>
        <table>
            <thead>
                <tr>
                    <th>Data e Ora</th>
                    <th>Peso</th>
                    <th>Momento</th>
                    <th>Appunti/Note</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <!-- I dati salvati compariranno qui -->
            </tbody>
        </table>
    </div>

    <!-- SCHERMATA SOLO PER GENERARE IL PDF COPIANDO I DATI -->
    <div id="pdf-template">
        <div class="pdf-page">
            <div class="pdf-header">
                <h1>Piccola Baby 👶🏼🎀</h1>
                <p>✨ Diario e Riepilogo delle Pesate della Nostra Piccola ✨</p>
            </div>
            <table class="pdf-table">
                <thead>
                    <tr>
                        <th>Data e Ora</th>
                        <th>Peso (kg)</th>
                        <th>Momento</th>
                        <th>Appunti e Note</th>
                    </tr>
                </thead>
                <tbody id="pdfTableBody">
                    <!-- Copia dei dati per il PDF -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // Memorizza i dati inseriti sul momento
        let pesateHistory = [];

        // Inserisce automaticamente l'orario attuale
        window.addEventListener('DOMContentLoaded', () => {
            const now = new Date();
            now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
            document.getElementById('date').value = now.toISOString().slice(0, 16);
        });

        // ⚠️ SOSTITUISCI CON IL TUO URL DI GOOGLE APPS SCRIPT FRA LE VIRGOLETTE
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw4BuzuFL1EJVprL1269JoCCWMhNgcKa6VmuKyTPb65uwKa08TvwAhDqypzm5vcyLSe/exec";

        document.getElementById('weightForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            const statusDiv = document.getElementById('status');
            
            submitBtn.disabled = true;
            submitBtn.innerText = 'Salvataggio in corso...';
            statusDiv.style.display = 'none';

            const dateValue = document.getElementById('date').value;
            const weightValue = document.getElementById('weight').value;
            const momentValue = document.getElementById('moment').value;
            const notesValue = document.getElementById('notes').value || "-";

            // Formattazione data italiana
            const d = new Date(dateValue);
            const dataFormattata = d.toLocaleDateString('it-IT') + ' ' + d.toLocaleTimeString('it-IT', {hour: '2-digit', minute:'2-digit'});

            // Inserisce i dati nell'array storico locale
            pesateHistory.push({
                date: dataFormattata,
                weight: parseFloat(weightValue).toFixed(3) + " kg",
                moment: momentValue,
                notes: notesValue
            });

            // Mostra subito i dati nelle tabelle
            renderTables();

            const formData = {
                date: dateValue,
                weight: weightValue,
                notes: momentValue + " | " + notesValue
            };

            // Spedisce a Google Sheets
            fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                cache: 'no-cache',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(formData)
            })
            .then(() => {
                statusDiv.innerText = "Pesata salvata con successo nel foglio! 💖👶🏼";
                statusDiv.className = 'status-message status-success';
                
                // Pulisce i campi compilati
                document.getElementById('weight').value = '';
                document.getElementById('notes').value = '';
                
                // Aggiorna l'ora corrente
                const now = new Date();
                now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
                document.getElementById('date').value = now.toISOString().slice(0, 16);
            })
            .catch(error => {
                console.error(error);
                statusDiv.innerText = "Salvataggio online non riuscito, ma aggiunto nel riepilogo in basso! ❌";
                statusDiv.className = 'status-message status-error';
            })
            .finally(() => {
                submitBtn.disabled = false;
                submitBtn.innerText = 'Salva Pesata ✨';
            });
        });

        // Compila graficamente il riepilogo e la pagina PDF nascosta
        function renderTables() {
            const tableBody = document.getElementById('tableBody');
            const pdfTableBody = document.getElementById('pdfTableBody');
            
            tableBody.innerHTML = "";
            pdfTableBody.innerHTML = "";

            // Ordina la cronologia inserendo le ultime novità in alto
            const sortedHistory = [...pesateHistory].reverse();

            sortedHistory.forEach(function(p) {
                const rowHtml = "<tr>" +
                    "<td>" + p.date + "</td>" +
                    "<td><strong>" + p.weight + "</strong></td>" +
                    "<td>" + p.moment + "</td>" +
                    "<td>" + p.notes + "</td>" +
                "</tr>";
                
                tableBody.innerHTML += rowHtml;
                pdfTableBody.innerHTML += rowHtml;
            });
        }

        // Scarica il file PDF leggendo la tabella
        document.getElementById('downloadPdfBtn').addEventListener('click', function() {
            const element = document.getElementById('pdf-template');
            
            if (pesateHistory.length === 0) {
                alert("Non ci sono ancora pesate inserite nella tabella! Aggiungi una pesata prima di scaricare il PDF. 👶🏼");
                return;
            }

            const opt = {
                margin:       10,
                filename:     'Piccola_Baby.pdf',
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2, useCORS: true, logging: false },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };

            html2pdf().set(opt).from(element).save();
        });
    </script>
</body>
</html>
