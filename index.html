    <style>
        :root {
            --primary-color: #ffb6c1; 
            --secondary-color: #a0e7e5; 
            --background-color: #fff9fa; 
            --text-color: #5c4d4d;
            --card-bg: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Comfortaa', 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--background-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        .app-container {
            background: var(--card-bg);
            border-radius: 30px;
            box-shadow: 0 10px 30px rgba(255, 182, 193, 0.3);
            width: 100%;
            max-width: 450px;
            padding: 25px;
            text-align: center;
            border: 4px solid #ffe4e1;
            position: relative;
        }

        .header-decor {
            font-size: 2.5rem;
            margin-bottom: 10px;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        h1 {
            font-size: 1.8rem;
            color: #ff8da1;
            margin-bottom: 5px;
            font-weight: 700;
        }

        .subtitle {
            font-size: 0.85rem;
            color: #8c7b7b;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            font-size: 0.9rem;
            color: #7a6666;
            padding-left: 5px;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 2px solid #ffe4e1;
            border-radius: 20px;
            font-size: 1.05rem;
            color: var(--text-color);
            background-color: #fffcfc;
            outline: none;
            transition: all 0.3s ease;
            -webkit-appearance: none;
        }

        input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 10px rgba(255, 182, 193, 0.5);
        }

        .weight-input-container {
            position: relative;
        }

        .weight-unit {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            font-weight: bold;
            color: #bfa3a3;
        }

        button {
            width: 100%;
            background: linear-gradient(135deg, #ffb6c1, #ff94a2);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 20px;
            font-size: 1.15rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 148, 162, 0.4);
            transition: all 0.3s ease;
            margin-top: 5px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 7px 20px rgba(255, 148, 162, 0.6);
        }

        .pwa-instruction {
            margin-top: 20px;
            background-color: #f0fdf4;
            border: 1px dashed #bbf7d0;
            padding: 12px;
            border-radius: 15px;
            font-size: 0.85rem;
            color: #166534;
        }

        .status-message {
            margin-top: 15px;
            padding: 12px;
            border-radius: 15px;
            font-size: 0.95rem;
            display: none;
        }

        .status-success { background-color: #e3fcef; color: #0e6245; border: 1px solid #abf5d1; display: block; }
        .status-error { background-color: #ffebe6; color: #bf2600; border: 1px solid #ffbdad; display: block; }

        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #ff94a2;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: inline-block;
            vertical-align: middle;
            margin-right: 8px;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="header-decor">👶🏼</div>
        <h1>Il Peso di Baby 🎀</h1>
        <div class="subtitle">Per Francesca • Inserimento Rapido</div>

        <form id="weightForm">
            <div class="form-group">
                <label for="date">Data e Ora</label>
                <input type="datetime-local" id="date" required>
            </div>

            <div class="form-group">
                <label for="weight">Peso Esatto</label>
                <div class="weight-input-container">
                    <input type="number" id="weight" step="0.001" min="0" placeholder="es. 3.450" inputmode="decimal" required>
                    <span class="weight-unit">kg</span>
                </div>
            </div>

            <div class="form-group">
                <label for="notes">Note</label>
                <input type="text" id="notes" placeholder="es. pre-poppata, nuda...">
            </div>

            <button type="submit" id="submitBtn">Salva Istantaneamente ✨</button>
        </form>

        <div id="status" class="status-message"></div>

        <!-- Istruzioni dinamiche basate sul dispositivo per installare l'app come icona/widget rapido -->
        <div class="pwa-instruction" id="pwaHint">
            💡 <strong>Consiglio per Francesca:</strong> Aggiungi questa pagina alla tua schermata Home per aprirla con un tocco come se fosse un'app reale!
        </div>
    </div>

    <script>
        // Imposta automaticamente data e ora corrente
        window.addEventListener('DOMContentLoaded', () => {
            const now = new Date();
            now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
            document.getElementById('date').value = now.toISOString().slice(0, 16);
            
            // Rileva sistema operativo per personalizzare l'aiuto widget
            const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
            const hint = document.getElementById('pwaHint');
            if (isIOS) {
                hint.innerHTML = "📲 <strong>Per Francesca:</strong> Premi il tasto <strong>Condividi</strong> in Safari (l'icona col quadrato e la freccia in alto) e seleziona <strong>'Aggiungi alla schermata Home'</strong> per creare il widget rapido.";
            } else {
                hint.innerHTML = "📲 <strong>Per Francesca:</strong> Premi i 3 pallini in alto a destra su Chrome e seleziona <strong>'Installa app'</strong> o <strong>'Aggiungi a schermata Home'</strong>.";
            }
        });

        // Configurazione URL Google Script (Ricordati di inserire il tuo link reale generato)
        const SCRIPT_URL = "INSERISCI_QUI_URL_GOOGLE_APPS_SCRIPT";

        document.getElementById('weightForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const submitBtn = document.getElementById('submitBtn');
            const statusDiv = document.getElementById('status');
            
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="loader"></span>Salvataggio...';
            statusDiv.className = 'status-message';
            statusDiv.style.display = 'none';

            const formData = {
                date: document.getElementById('date').value,
                weight: document.getElementById('weight').value,
                notes: document.getElementById('notes').value
            };

            fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                cache: 'no-cache',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(formData)
            })
            .then(() => {
                statusDiv.innerText = "Peso registrato nel foglio! 💖👶🏼";
                statusDiv.className = 'status-message status-success';
                document.getElementById('weight').value = '';
                document.getElementById('notes').value = '';
                const now = new Date();
                now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
                document.getElementById('date').value = now.toISOString().slice(0, 16);
            })
            .catch(error => {
                console.error(error);
                statusDiv.innerText = "Errore. Riprova! ❌";
                statusDiv.className = 'status-message status-error';
            })
            .finally(() => {
                submitBtn.disabled = false;
                submitBtn.innerHTML = 'Salva Istantaneamente ✨';
            });
        });

        // Registrazione Service Worker per abilitare la funzionalità PWA offline / installabile
        if ('serviceWorker' in navigator) {
            const swCode = `
                self.addEventListener('install', e => self.skipWaiting());
                self.addEventListener('fetch', e => e.respondWith(fetch(e.request).catch(() => caches.match(e.request))));
            `;
            const blob = new Blob([swCode], {type: 'application/javascript'});
            navigator.serviceWorker.register(URL.createObjectURL(blob));
        }
    </script>
</body>
</html>
