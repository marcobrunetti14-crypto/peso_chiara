<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Il Peso di Baby</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Peso Baby">

    <style>
        :root {
            --primary-color: #ffb6c1; 
            --background-color: #fff9fa; 
            --text-color: #5c4d4d;
            --card-bg: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--background-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .app-container {
            background: var(--card-bg);
            border-radius: 30px;
            box-shadow: 0 10px 30px rgba(255, 182, 193, 0.3);
            width: 100%;
            max-width: 500px;
            padding: 30px;
            text-align: center;
            border: 4px solid #ffe4e1;
            margin-bottom: 30px;
        }

        .header-decor {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 2rem;
            color: #ff8da1;
            margin-bottom: 5px;
        }

        .subtitle {
            font-size: 0.9rem;
            color: #8c7b7b;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 0.95rem;
            color: #7a6666;
        }

        input, select {
            width: 100%;
            padding: 15px;
            border: 2px solid #ffe4e1;
            border-radius: 20px;
            font-size: 1.1rem;
            color: var(--text-color);
            background-color: #fffcfc;
            outline: none;
        }

        input:focus, select:focus {
            border-color: var(--primary-color);
        }

        .weight-input-container {
            position: relative;
        }

        .weight-unit {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            font-weight: bold;
            color: #bfa3a3;
        }

        button {
            width: 100%;
            background: linear-gradient(135deg, #ffb6c1, #ff94a2);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 20px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 148, 162, 0.4);
            margin-top: 10px;
        }

        .btn-pdf {
            background: linear-gradient(135deg, #a0e7e5, #74d1cf);
            box-shadow: 0 5px 15px rgba(160, 231, 229, 0.6);
            margin-top: 20px;
            color: #3d5a59;
        }

        .status-message {
            margin-top: 20px;
            padding: 12px;
            border-radius: 15px;
            font-size: 0.95rem;
            display: none;
        }

        .status-success { background-color: #e3fcef; color: #0e6245; display: block; }
        .status-error { background-color: #ffebe6; color: #bf2600; display: block; }

        .table-container {
            width: 100%;
            max-width: 600px;
            background: white;
            border-radius: 25px;
            padding: 20px;
            border: 4px solid #ffe4e1;
            box-shadow: 0 10px 30px rgba(255, 182, 193, 0.2);
            overflow-x: auto;
        }

        .table-title {
            color: #ff8da1;
            margin-bottom: 15px;
            font-size: 1.4rem;
            text-align: center;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 12px 15px;
            border-bottom: 1px solid #ffe4e1;
            font-size: 0.95rem;
        }

        th {
            background-color: #fff1f3;
            color: #ff8da1;
            font-weight: bold;
        }

        @media print {
            body {
                background-color: #fff9fa !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
                padding: 0;
            }
            .app-container {
                display: none !important;
            }
            .table-container {
                box-shadow: none !important;
                border: none !important;
                width: 100% !important;
                max-width: 100% !important;
                padding: 0 !important;
            }
            .table-title {
                font-size: 2rem !important;
                margin-bottom: 20px !important;
            }
            th {
                background-color: #ffb6c1 !important;
                color: white !important;
            }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="header-decor">👶🏼 🎀 🍼 ✨</div>
        <h1>Il Peso di Baby 🎀</h1>
        <div class="subtitle">Per Francesca • Registra la crescita con un click</div>

        <form id="weightForm">
            <div class="form-group">
                <label for="date">📅 Data e Ora della pesata</label>
                <input type="datetime-local" id="date" required>
            </div>

            <div class="form-group">
                <label for="weight">⚖️ Peso Esatto</label>
                <div class="weight-input-container">
                    <input type="number" id="weight" step="0.001" min="0" placeholder="es. 3.450" inputmode="decimal" required>
                    <span class="weight-unit">kg</span>
                </div>
            </div>

            <div class="form-group">
                <label for="moment">🍼 Momento della pesata</label>
                <select id="moment" required>
                    <option value="Prima della pesata">🍼 Prima della pesata</option>
                    <option value="Dopo la pesata">✨ Dopo la pesata</option>
                </select>
            </div>

            <div class="form-group">
                <label for="notes">📝 Appunti e Note Libere</label>
                <input type="text" id="notes" placeholder="Scrivi qui altri dettagli (es. nuda, tranquilla...)">
            </div>

            <button type="submit" id="submitBtn">Salva Pesata ✨</button>
        </form>

        <div id="status" class="status-message"></div>
        
        <button type="button" class="btn-pdf" id="downloadPdfBtn">📥 Scarica PDF "Piccola Baby"</button>
    </div>

    <div class="table-container" id="printableTable">
        <h2 class="table-title" id="mainTitle">📊 Riepilogo delle Pesate</h2>
        <table>
            <thead>
                <tr>
                    <th>Data e Ora</th>
                    <th>Peso</th>
                    <th>Momento</th>
                    <th>Appunti/Note</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <tr>
                    <td colspan="4" style="text-align: center; color: #bfa3a3;">Caricamento storico pesate... 🎀</td>
                </tr>
            </tbody>
        </table>
    </div>

    <script>
        var pesateHistory = [];

        // ⚠️ INCOLLA QUI IL NUOVO URL DI GOOGLE APPS SCRIPT
        var SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzA3jdsRBKm0K9bX_lxzgwTQCHoKssR63eL3hC3VhwVmZpL9APhUdugCZ54_J36hODy/exec";

        function caricaStoricoDaGoogle() {
            var tableBody = document.getElementById('tableBody');
            
            fetch(SCRIPT_URL)
            .then(function(response) {
                return response.json();
            })
            .then(function(data) {
                if(data && data.length > 0) {
                    pesateHistory = data;
                    renderTables();
                } else {
                    tableBody.innerHTML = '<tr><td colspan="4" style="text-align: center; color: #bfa3a3;">Nessuna pesata salvata nel foglio. Inserisci la prima! 👶🏼</td></tr>';
                }
            })
            .catch(function(error) {
                console.error(error);
                tableBody.innerHTML = '<tr><td colspan="4" style="text-align: center; color: #bf2600;">Impossibile caricare i vecchi dati. ❌</td></tr>';
            });
        }

        window.addEventListener('DOMContentLoaded', function() {
            var now = new Date();
            now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
            document.getElementById('date').value = now.toISOString().slice(0, 16);
            
            caricaStoricoDaGoogle();
        });

        document.getElementById('weightForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            var submitBtn = document.getElementById('submitBtn');
            var statusDiv = document.getElementById('status');
            
            submitBtn.disabled = true;
            submitBtn.innerText = 'Salvataggio in corso...';
            statusDiv.style.display = 'none';

            var dateValue = document.getElementById('date').value;
            var weightValue = document.getElementById('weight').value;
            var momentValue = document.getElementById('moment').value;
            var notesValue = document.getElementById('notes').value || "-";

            var d = new Date(dateValue);
            var dataFormattata = d.toLocaleDateString('it-IT') + ' ' + d.toLocaleTimeString('it-IT', {hour: '2-digit', minute:'2-digit'});

            var nuovaPesata = {
                date: dataFormattata,
                weight: parseFloat(weightValue).toFixed(3) + " kg",
                moment: momentValue,
                notes: notesValue
            };
            
            // Inserisce in cima alla tabella locale
            pesateHistory.unshift(nuovaPesata);
            renderTables();

            var formData = {
                date: dateValue,
                weight: weightValue,
                moment: momentValue,
                notes: notesValue
            };

            fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                cache: 'no-cache',
                redirect: 'follow',
                body: JSON.stringify(formData)
            })
            .then(function() {
                statusDiv.innerText = "Pesata salvata con successo! 💖👶🏼";
                statusDiv.className = 'status-message status-success';
                
                document.getElementById('weight').value = '';
                document.getElementById('notes').value = '';
                
                var now = new Date();
                now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
                document.getElementById('date').value = now.toISOString().slice(0, 16);
            })
            .catch(function(error) {
                console.error(error);
                statusDiv.innerText = "Errore di rete nell'invio a Google. ❌";
                statusDiv.className = 'status-message status-error';
            })
            .finally(function() {
                submitBtn.disabled = false;
                submitBtn.innerText = 'Salva Pesata ✨';
            });
        });

        function renderTables() {
            var tableBody = document.getElementById('tableBody');
            tableBody.innerHTML = "";

            for (var i = 0; i < pesateHistory.length; i++) {
                var p = pesateHistory[i];
                
                var row = document.createElement('tr');
                
                var tdDate = document.createElement('td');
                tdDate.textContent = p.date;
                row.appendChild(tdDate);
                
                var tdWeight = document.createElement('td');
                var strong = document.createElement('strong');
                strong.textContent = p.weight;
                tdWeight.appendChild(strong);
                row.appendChild(tdWeight);
                
                var tdMoment = document.createElement('td');
                tdMoment.textContent = p.moment;
                row.appendChild(tdMoment);
                
                var tdNotes = document.createElement('td');
                tdNotes.textContent = p.notes;
                row.appendChild(tdNotes);
                
                tableBody.appendChild(row);
            }
        }

        document.getElementById('downloadPdfBtn').addEventListener('click', function() {
            if (pesateHistory.length === 0) {
                alert("Non ci sono pesate da scaricare!");
                return;
            }

            var titoloOriginale = document.getElementById('mainTitle').innerText;
            document.getElementById('mainTitle').innerText = "Piccola Baby 👶🏼🎀";
            
            var titoloDocumentoOriginale = document.title;
            document.title = "Piccola_Baby";

            window.print();

            document.getElementById('mainTitle').innerText = titoloOriginale;
            document.title = titoloDocumentoOriginale;
        });
    </script>
</body>
</html>
