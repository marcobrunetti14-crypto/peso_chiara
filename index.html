<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Il Peso di Baby</title>
    <style>
        :root {
            --primary-color: #ffb6c1; /* Rosa pastello neonati */
            --secondary-color: #a0e7e5; /* Verde acqua pastello */
            --background-color: #fff9fa; /* Sfondo caldissimo e morbido */
            --text-color: #5c4d4d;
            --card-bg: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Comfortaa', 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--background-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .app-container {
            background: var(--card-bg);
            border-radius: 30px;
            box-shadow: 0 10px 30px rgba(255, 182, 193, 0.3);
            width: 100%;
            max-width: 450px;
            padding: 30px;
            text-align: center;
            border: 4px solid #ffe4e1;
            position: relative;
            overflow: hidden;
        }

        /* Elementi decorativi stile neonato */
        .app-container::before {
            content: '👶🏼 ✨ 🍼';
            position: absolute;
            top: 10px;
            right: 20px;
            font-size: 1.2rem;
            opacity: 0.7;
        }

        h1 {
            font-size: 2rem;
            color: #ff8da1;
            margin-bottom: 5px;
            font-weight: 700;
        }

        .subtitle {
            font-size: 0.9rem;
            color: #8c7b7b;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 0.95rem;
            color: #7a6666;
            padding-left: 5px;
        }

        input {
            width: 100%;
            padding: 15px;
            border: 2px solid #ffe4e1;
            border-radius: 20px;
            font-size: 1.1rem;
            color: var(--text-color);
            background-color: #fffcfc;
            outline: none;
            transition: all 0.3s ease;
        }

        input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 10px rgba(255, 182, 193, 0.5);
        }

        .weight-input-container {
            position: relative;
        }

        .weight-unit {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            font-weight: bold;
            color: #bfa3a3;
        }

        button {
            width: 100%;
            background: linear-gradient(135deg, #ffb6c1, #ff94a2);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 20px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 148, 162, 0.4);
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 7px 20px rgba(255, 148, 162, 0.6);
        }

        button:active {
            transform: translateY(1px);
        }

        .status-message {
            margin-top: 20px;
            padding: 12px;
            border-radius: 15px;
            font-size: 0.95rem;
            display: none;
            animation: fadeIn 0.5s ease;
        }

        .status-success {
            background-color: #e3fcef;
            color: #0e6245;
            border: 1px solid #abf5d1;
            display: block;
        }

        .status-error {
            background-color: #ffebe6;
            color: #bf2600;
            border: 1px solid #ffbdad;
            display: block;
        }

        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #ff94a2;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
            display: inline-block;
            vertical-align: middle;
            margin-right: 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10deg); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <h1>Il Peso di Baby 🎀</h1>
        <div class="subtitle">Per Francesca • Registra la crescita con un click</div>

        <form id="weightForm">
            <div class="form-group">
                <label for="date">Data e Ora della pesata</label>
                <input type="datetime-local" id="date" required>
            </div>

            <div class="form-group">
                <label for="weight">Peso Esatto</label>
                <div class="weight-input-container">
                    <input type="number" id="weight" step="0.001" min="0" placeholder="es. 3.450" required>
                    <span class="weight-unit">kg</span>
                </div>
            </div>

            <div class="form-group">
                <label for="notes">Note (facoltativo)</label>
                <input type="text" id="notes" placeholder="es. Dopo la poppata, a digiuno...">
            </div>

            <button type="submit" id="submitBtn">Salva Pesata ✨</button>
        </form>

        <div id="status" class="status-message"></div>
    </div>

    <script>
        // Imposta automaticamente la data e l'ora corrente per facilitare Francesca
        window.addEventListener('DOMContentLoaded', () => {
            const now = new Date();
            now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
            document.getElementById('date').value = now.toISOString().slice(0, 16);
        });

        // URL del Web App di Google Apps Script (andrà sostituito dopo la configurazione)
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw4BuzuFL1EJVprL1269JoCCWMhNgcKa6VmuKyTPb65uwKa08TvwAhDqypzm5vcyLSe/exec";

        document.getElementById('weightForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            const statusDiv = document.getElementById('status');
            
            // Stato di caricamento
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="loader"></span>Salvataggio in corso...';
            statusDiv.className = 'status-message';
            statusDiv.style.display = 'none';

            const formData = {
                date: document.getElementById('date').value,
                weight: document.getElementById('weight').value,
                notes: document.getElementById('notes').value
            };

            // Invio dati a Google Sheets tramite Google Apps Script
            fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors', // Necessario per evitare blocchi CORS con Apps Script
                cache: 'no-cache',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(formData)
            })
            .then(response => {
                // Avendo impostato no-cors non possiamo leggere la risposta reale,
                // assumiamo il successo se non va in catch.
                statusDiv.innerText = "Pesata salvata con successo nel foglio! 💖👶🏼";
                statusDiv.classList.add('status-success');
                
                // Resetta solo il peso e le note, aggiorna la data
                document.getElementById('weight').value = '';
                document.getElementById('notes').value = '';
                const now = new Date();
                now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
                document.getElementById('date').value = now.toISOString().slice(0, 16);
            })
            .catch(error => {
                console.error('Error:', error);
                statusDiv.innerText = "Errore nel salvataggio. Riprova! ❌";
                statusDiv.classList.add('status-error');
            })
            .finally(() => {
                submitBtn.disabled = false;
                submitBtn.innerHTML = 'Salva Pesata ✨';
            });
        });
    </script>
</body>
</html>
